<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>[YOUR STORE NAME] - Video Editing Resources</title>
<meta name="description" content="Premium Alight Motion XML files, CapCut templates, presets, overlays, transitions and editing resources for creators.">
<style>
:root{--bg:#f5f6fb;--card:#fff;--ink:#181a2e;--mut:#5f6480;--line:#e2e4f0;--acc:#5b4bff;--acc2:#ff5a6e;--r:14px}
*{box-sizing:border-box;margin:0}html{scroll-behavior:smooth}
body{font:17px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);overflow-x:hidden}
a{color:inherit;text-decoration:none}img{max-width:100%}
.w{max-width:1120px;margin:0 auto;padding:0 18px}
.bar{background:var(--ink);color:#fff;text-align:center;font-size:14px;padding:8px}
header{position:sticky;top:0;z-index:20;background:rgba(245,246,251,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hd{display:flex;align-items:center;gap:14px;height:64px}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:19px}
.logo i{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:grid;place-items:center;color:#fff;font-style:normal;font-size:14px}
nav{display:flex;gap:20px;margin-left:auto;font-size:15px;font-weight:600}
nav a{color:var(--mut)}nav a:hover{color:var(--acc)}
form.s{display:flex;background:#fff;border:1px solid var(--line);border-radius:99px;overflow:hidden}
form.s input{border:0;padding:9px 14px;font:inherit;font-size:15px;width:170px;outline:0;background:none}
form.s button{border:0;background:none;padding:0 14px;font-size:17px;cursor:pointer}
#burger{display:none;border:1px solid var(--line);background:#fff;border-radius:10px;width:44px;height:44px;font-size:22px;cursor:pointer}
@media(max-width:860px){#burger{display:block;margin-left:auto}nav{display:none;position:absolute;top:64px;left:0;right:0;background:#fff;flex-direction:column;gap:0;padding:8px 18px 14px;border-bottom:1px solid var(--line)}nav.open{display:flex}nav a{padding:13px 0;border-bottom:1px solid var(--line);color:var(--ink);font-size:17px}form.s{order:5;width:100%}.hd{flex-wrap:wrap;height:auto;padding:10px 18px}form.s{flex:1 1 100%}form.s input{width:100%}nav{top:auto;position:static;order:6;width:100%;margin:0;padding:0}nav.open{padding-bottom:6px}}
.btn{display:inline-block;padding:13px 22px;border-radius:12px;font-weight:700;font-size:16px;border:2px solid var(--ink);cursor:pointer;text-align:center;min-height:46px;background:none;font-family:inherit;color:var(--ink)}
.btn.p{background:var(--acc);border-color:var(--acc);color:#fff}.btn.p:hover{background:#4738e6}
.btn.g{border-color:var(--line);background:#fff}.btn:hover{border-color:var(--acc)}
.hero{padding:44px 0 36px}
.hero h1{font-size:clamp(34px,7vw,60px);line-height:1.05;letter-spacing:-.03em;max-width:12ch}
.hero p{color:var(--mut);max-width:46ch;margin:16px 0 24px;font-size:18px}
.row{display:flex;gap:12px;flex-wrap:wrap}
.tl{margin-top:34px;background:var(--ink);border-radius:var(--r);padding:16px 16px 18px;position:relative;overflow:hidden}
.tl b{display:block;height:22px;margin:7px 0;border-radius:6px;font-size:11px;color:#fff;padding:3px 9px;font-weight:600;white-space:nowrap;overflow:hidden}
.tl:after{content:"";position:absolute;top:0;bottom:0;left:64%;width:2px;background:var(--acc2);animation:ph 7s ease-in-out infinite alternate}
@keyframes ph{from{left:6%}to{left:92%}}
@media(prefers-reduced-motion:reduce){.tl:after{animation:none}}
section{padding:34px 0}
h2{font-size:clamp(24px,4.5vw,34px);letter-spacing:-.02em;line-height:1.15}
.sub{color:var(--mut);margin:6px 0 20px}
.hh{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.cat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;font-weight:700;display:flex;flex-direction:column;gap:8px;min-height:96px}
.cat span{font-size:26px}.cat:hover{border-color:var(--acc)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.pc{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.pv{aspect-ratio:16/10;display:grid;place-items:center;font-size:44px;position:relative;color:#fff}
.pv em{position:absolute;top:10px;left:10px;background:var(--acc2);font:700 12px system-ui;font-style:normal;padding:4px 9px;border-radius:99px}
.pb{padding:16px;display:flex;flex-direction:column;gap:8px;flex:1}
.pb h3{font-size:18px;line-height:1.25}.pb p{color:var(--mut);font-size:15px;flex:1}
.pr{font-weight:800;font-size:19px}.pr s{color:var(--mut);font-weight:400;font-size:15px;margin-left:6px}
.pb .row{gap:8px}.pb .btn{flex:1;padding:11px 8px;font-size:15px}
.ban{background:linear-gradient(120deg,var(--acc),#8a3ffc 60%,var(--acc2));color:#fff;border-radius:20px;padding:40px 24px}
.ban p{margin:8px 0 20px;opacity:.9}.ban .btn{background:#fff;border-color:#fff;color:var(--ink)}
.free{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px 22px}
.why{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.why div{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.why h3{font-size:17px;margin:6px 0 4px}.why p{color:var(--mut);font-size:15px}
details{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;padding:14px 16px}
summary{font-weight:700;cursor:pointer}details p{color:var(--mut);margin-top:8px}
footer{background:var(--ink);color:#c9cce0;margin-top:30px;padding:36px 0 22px;font-size:15px}
footer .g{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:24px}
footer h4{color:#fff;margin-bottom:8px}footer a{display:block;padding:4px 0}footer a:hover{color:#fff}
.cp{border-top:1px solid #34375a;margin-top:22px;padding-top:14px;font-size:13px}
.pg{display:grid;grid-template-columns:1fr 1fr;gap:28px;padding:26px 0}
@media(max-width:760px){.pg{grid-template-columns:1fr}}
.pg .pv{border-radius:var(--r);font-size:80px}
.box{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-top:14px}
.box h3{font-size:17px;margin-bottom:6px}.box ul,.box ol{padding-left:20px;color:var(--mut)}
.note{background:#eef0ff;border:1px dashed var(--acc);border-radius:12px;padding:12px 14px;font-size:15px;margin:14px 0}
.crumb{color:var(--mut);font-size:14px;padding-top:18px}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:var(--r);padding:30px;text-align:center;color:var(--mut)}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
</style></head><body>
<div class="bar" id="ann"></div>
<header><div class="w hd">
<a class="logo" href="#/"><i id="lg">▶</i><span class="sn"></span></a>
<button id="burger" aria-label="Menu">☰</button>
<form class="s" id="sf"><input id="q" placeholder="Search XML, preset, CapCut…" aria-label="Search"><button aria-label="Search">🔍</button></form>
<nav id="nav"><a href="#/">Home</a><a href="#/all">All Products</a><a href="#/cats">Categories</a><a href="#/c/free">Free Resources</a><a href="#/about">About</a><a href="#/contact">Contact</a></nav>
</div></header>
<main id="app"></main>
<footer><div class="w"><div class="g" id="ft"></div><div class="cp">© <span id="yr"></span> <span class="sn"></span>. Demo products are placeholders. Replace them in the CONFIG section of this file.</div></div></footer>

<script>
/* ============ EDIT EVERYTHING HERE ============ */
const CONFIG={
 name:"[YOUR STORE NAME]",
 tagline:"Premium Editing Resources for Creators",
 currency:"₹",
 // Change to your Telegram / WhatsApp / Google Form / payment link.
 // WhatsApp links like https://wa.me/91XXXXXXXXXX also get the product name added automatically.
 orderLink:"https://t.me/YOUR_USERNAME",
 orderNote:"After placing your order and completing payment, your digital file/link will be provided.",
 links:{Telegram:"https://t.me/YOUR_USERNAME",Instagram:"https://instagram.com/YOUR_USERNAME",YouTube:"https://youtube.com/@YOUR_CHANNEL",WhatsApp:"https://wa.me/91XXXXXXXXXX"},
 email:"you@example.com"
};
const CATS=[
 {id:"alight",name:"Alight Motion XML",icon:"🎞️"},
 {id:"capcut",name:"CapCut Templates",icon:"✂️"},
 {id:"presets",name:"Presets",icon:"🎨"},
 {id:"overlays",name:"Overlays & Effects",icon:"✨"},
 {id:"transitions",name:"Transitions",icon:"🔀"},
 {id:"tools",name:"Editing Tools",icon:"🧰"},
 {id:"free",name:"Free Resources",icon:"🎁"}];
/* Demo products - replace names, prices, text, includes, compat, link. hue = preview colour (0-360).
   old = original price (shows discount badge). trend/feat = show in Trending/Featured. link = optional own order link. preview = optional preview video/image URL. */
const P=[
 {id:"velocity-xml",name:"Velocity XML Pack",cat:"alight",price:199,old:299,hue:255,icon:"⚡",feat:1,desc:"Smooth speed-ramp XML files for Alight Motion.",long:"A demo pack of velocity edits you can import into Alight Motion. Replace this text with your own description.",inc:["20 XML files","Installation instructions","Preview","Usage guide"],compat:"Alight Motion / Android",tags:"xml velocity alight motion"},
 {id:"shake-xml",name:"Smooth Shake XML Pack",cat:"alight",price:149,hue:335,icon:"📳",feat:1,trend:1,desc:"Clean shake and impact effects as XML files.",inc:["15 XML files","Installation instructions","Usage guide"],compat:"Alight Motion / Android",tags:"xml shake alight effects"},
 {id:"cinematic-presets",name:"Cinematic Preset Pack",cat:"presets",price:249,old:399,hue:200,icon:"🎬",feat:1,trend:1,desc:"Film-style colour looks for videos and photos.",inc:["12 video presets","8 Lightroom presets","Usage guide"],compat:"Lightroom Mobile, Alight Motion, CapCut (colour settings)",tags:"preset lightroom cinematic colour"},
 {id:"capcut-trending",name:"Trending CapCut Templates",cat:"capcut",price:129,hue:290,icon:"✂️",feat:1,trend:1,desc:"Ready-to-use template links for quick reels.",inc:["10 template links","How-to guide"],compat:"CapCut / Android and iOS",tags:"capcut template reels"},
 {id:"reel-transitions",name:"Reel Transition Pack",cat:"transitions",price:179,old:229,hue:20,icon:"🔀",feat:1,trend:1,desc:"Snappy transitions built for short-form reels.",inc:["25 transitions","Installation instructions","Preview"],compat:"Alight Motion / CapCut",tags:"transition reel"},
 {id:"tools-pack",name:"Editing Tools Pack",cat:"tools",price:99,hue:165,icon:"🧰",feat:1,desc:"Handy tools and guides for mobile editors.",inc:["Tool list with guides","Setup steps"],compat:"Android",tags:"tools editing"},
 {id:"glow-overlays",name:"Glow Overlay Pack",cat:"overlays",price:119,hue:45,icon:"✨",trend:1,desc:"Light leaks, glows and dust overlays.",inc:["30 overlays","Usage guide"],compat:"Any editor with overlay support",tags:"overlay effects glow"},
 {id:"lr-presets",name:"Lightroom Mobile Presets",cat:"presets",price:159,hue:150,icon:"🖼️",trend:1,desc:"Warm, moody and clean looks for photos.",inc:["15 DNG presets","Install guide"],compat:"Lightroom Mobile",tags:"lightroom preset dng"},
 {id:"free-xml",name:"Free Starter XML",cat:"free",price:0,hue:110,icon:"🎁",desc:"One free XML to try before you buy.",inc:["1 XML file","Instructions"],compat:"Alight Motion / Android",tags:"free xml"},
 {id:"free-fonts",name:"Free Font Bundle",cat:"free",price:0,hue:230,icon:"🔤",desc:"A small set of free-to-use fonts for titles.",inc:["5 fonts","License note"],compat:"Android, iOS, Desktop",tags:"free fonts"}
];
const FAQ=[
 ["What products do you provide?","Alight Motion XML files, CapCut templates, video and Lightroom presets, overlays, effects, transitions, fonts and editing tools."],
 ["How do I receive my product?","After you place your order and complete payment, your digital file or link is sent to you through the contact method you ordered with."],
 ["Are these physical products?","No. Everything is digital. Nothing is shipped."],
 ["Can I use these files on mobile?","Yes. Most files are made for mobile editing apps. Check the Compatibility section on each product page."],
 ["How do I place an order?","Open a product and tap Order Now. It opens our order chat or form. Send your product name and follow the steps."],
 ["Where can I contact you?","Use the Telegram, Instagram, YouTube or WhatsApp buttons on the Contact page."]];
const PAGES={
 about:["About Us","<span class=sn></span> shares editing resources for creators. Replace this text with your own story."],
 privacy:["Privacy Policy","Replace with your privacy policy text. Explain what details you collect when someone orders."],
 terms:["Terms & Conditions","Replace with your terms. Explain how files may be used and shared."],
 refund:["Refund Policy","Replace with your refund policy. Digital files usually cannot be returned, so say clearly what you offer."]};
/* ============ END EDIT ZONE ============ */

const $=s=>document.querySelector(s),app=$("#app");
const cn=id=>CATS.find(c=>c.id==id)?.name||"";
const money=n=>n?CONFIG.currency+n:"Free";
const orderHref=p=>{let l=p.link||CONFIG.orderLink;return /wa\.me|whatsapp/.test(l)&&!/[?]text=/.test(l)?l+(l.includes("?")?"&":"?")+"text="+encodeURIComponent("Hi, I want to order: "+p.name):l};
const bg=h=>`background:linear-gradient(135deg,hsl(${h} 70% 52%),hsl(${(h+50)%360} 75% 38%))`;
const off=p=>p.old?Math.round((1-p.price/p.old)*100):0;
function card(p){return `<article class="pc"><a class="pv" href="#/p/${p.id}" style="${bg(p.hue)}" aria-label="${p.name}">${p.icon}${off(p)?`<em>${off(p)}% OFF</em>`:""}</a><div class="pb"><h3>${p.name}</h3><p>${p.desc}</p><div class="pr">${money(p.price)}${p.old?`<s>${CONFIG.currency}${p.old}</s>`:""}</div><div class="row"><a class="btn g" href="#/p/${p.id}">View Product</a><a class="btn p" target="_blank" rel="noopener" href="${orderHref(p)}">${p.price?"Buy / Order":"Get Free"}</a></div></div></article>`}
const grid=a=>a.length?`<div class="grid">${a.map(card).join("")}</div>`:`<div class="empty">No products found. Try another word like XML, preset or CapCut.</div>`;
const catGrid=()=>`<div class="cats">${CATS.map(c=>`<a class="cat" href="#/c/${c.id}"><span>${c.icon}</span>${c.name}</a>`).join("")}</div>`;
const head=(t,s,l,h)=>`<div class="hh"><div><h2>${t}</h2>${s?`<p class="sub" style="margin-bottom:0">${s}</p>`:""}</div>${l?`<a class="btn g" href="${h}">${l}</a>`:""}</div>`;
const list=(t,a,s)=>`<div class="w"><p class="crumb"><a href="#/">Home</a> / ${t}</p><section>${head(t,s)}${grid(a)}</section></div>`;
const social=()=>Object.entries(CONFIG.links).map(([k,v])=>`<a class="btn g" target="_blank" rel="noopener" href="${v}">${k}</a>`).join("");

function home(){return `
<div class="w hero"><h1>Upgrade Your Video Editing</h1><p>Discover premium XML files, templates, presets, effects and useful editing resources for your next project.</p>
<div class="row"><a class="btn p" href="#/all">Explore Products</a><a class="btn" href="#/c/free">Free Resources</a></div>
<div class="tl" aria-hidden="true"><b style="width:46%;background:#5b4bff">Velocity XML</b><b style="width:30%;margin-left:12%;background:#ff5a6e">Shake</b><b style="width:38%;margin-left:30%;background:#12b89a">Preset</b><b style="width:24%;margin-left:6%;background:#f5a524">Overlay</b></div></div>
<div class="w"><section id="cats">${head("Shop by category")}${catGrid()}</section>
<section>${head("Featured products","Demo products. Replace them with your own.","View all","#/all")}${grid(P.filter(p=>p.feat))}</section>
<section>${head("Trending products")}${grid(P.filter(p=>p.trend))}</section>
<section><div class="ban"><h2>Level Up Your Edits</h2><p>Everything you need to create better videos.</p><a class="btn" href="#/all">Explore Collection</a></div></section>
<section><div class="free"><h2>Free Editing Resources</h2><p class="sub">Download useful resources for your next edit.</p><a class="btn p" href="#/c/free">Explore Free Resources</a></div></section>
<section>${head("Why choose us")}<div class="why"><div>💎<h3>Premium Resources</h3><p>Files made with care for smooth, polished edits.</p></div><div>📲<h3>Easy Access</h3><p>Order in a few taps from your phone.</p></div><div>🎥<h3>Creator Friendly</h3><p>Simple guides so you can start editing fast.</p></div><div>🔄<h3>Regular New Resources</h3><p>New packs are added over time.</p></div></div></section>
<section>${head("Frequently asked questions")}${faq()}</section>
<section>${contactBox()}</section></div>`}
const faq=()=>FAQ.map(f=>`<details><summary>${f[0]}</summary><p>${f[1]}</p></details>`).join("");
const contactBox=()=>`<div class="free"><h2>Contact and community</h2><p class="sub">Questions or custom requests? Message us.</p><div class="row">${social()}</div></div>`;

function prod(p){const c=CATS.find(c=>c.id==p.cat);
return `<div class="w"><p class="crumb"><a href="#/">Home</a> / <a href="#/c/${p.cat}">${c.name}</a> / ${p.name}</p><div class="pg"><div><div class="pv" style="${bg(p.hue)}">${p.icon}${off(p)?`<em>${off(p)}% OFF</em>`:""}</div>${p.preview?`<a class="btn g" style="margin-top:12px;width:100%" target="_blank" rel="noopener" href="${p.preview}">Watch preview</a>`:`<div class="note">Preview: add a video or image link in this product's <code>preview</code> field.</div>`}</div>
<div><h1 style="font-size:30px;line-height:1.15">${p.name}</h1><div class="pr" style="font-size:26px;margin:8px 0">${money(p.price)}${p.old?`<s>${CONFIG.currency}${p.old}</s>`:""}</div><p>${p.desc}</p>
<a class="btn p" style="width:100%;margin-top:14px" target="_blank" rel="noopener" href="${orderHref(p)}">${p.price?"Order Now":"Get This Free Resource"}</a><div class="note">${CONFIG.orderNote}</div>
<div class="box"><h3>Details</h3><p style="color:var(--mut)">${p.long||p.desc+" Replace this with a full description of the product."}</p></div>
<div class="box"><h3>What's included</h3><ul>${p.inc.map(i=>`<li>${i}</li>`).join("")}</ul></div>
<div class="box"><h3>Compatibility</h3><p style="color:var(--mut)">${p.compat}</p></div>
<div class="box"><h3>How to use</h3><ol><li>Get your file or link after your order.</li><li>Open it in your editing app.</li><li>Follow the included guide and start editing.</li></ol></div></div></div>
<section>${head("More like this")}${grid(P.filter(x=>x.cat==p.cat&&x.id!=p.id).slice(0,3))}</section></div>`}

function route(){const h=decodeURIComponent(location.hash.slice(1)||"/"),m=h.split("/"),k=m[1],v=m.slice(2).join("/");let o;
 if(!k)o=home();
 else if(k=="all")o=list("All Products",P,"Everything in the store.");
 else if(k=="cats")o=`<div class="w"><p class="crumb"><a href="#/">Home</a> / Categories</p><section>${head("Categories")}${catGrid()}</section></div>`;
 else if(k=="c"){const c=CATS.find(c=>c.id==v);o=c?list(c.name,P.filter(p=>p.cat==v)):home()}
 else if(k=="p"){const p=P.find(p=>p.id==v);o=p?prod(p):home();if(p)document.title=p.name+" - "+CONFIG.name}
 else if(k=="s"){const w=v.toLowerCase().split(/\s+/).filter(Boolean);o=list('Search: "'+v+'"',P.filter(p=>{const t=(p.name+" "+p.desc+" "+p.tags+" "+cn(p.cat)).toLowerCase();return w.every(x=>t.includes(x))}))}
 else if(k=="contact")o=`<div class="w"><p class="crumb"><a href="#/">Home</a> / Contact</p><section>${head("Contact")}${contactBox()}<div class="note" style="margin-top:14px">Email: ${CONFIG.email}</div><section>${head("FAQ")}${faq()}</section></section></div>`;
 else if(PAGES[k])o=`<div class="w"><p class="crumb"><a href="#/">Home</a> / ${PAGES[k][0]}</p><section><h2>${PAGES[k][0]}</h2><p class="sub">${PAGES[k][1]}</p></section></div>`;
 else o=home();
 app.innerHTML=o;if(!["p"].includes(k))document.title=CONFIG.name+" - Video Editing Resources";
 document.querySelectorAll(".sn").forEach(e=>e.textContent=CONFIG.name);
 $("#nav").classList.remove("open");if(!(k==undefined&&!location.hash))scrollTo(0,0)}

$("#ann").textContent=CONFIG.tagline;
$("#ft").innerHTML=`<div><h4 class="sn"></h4><p>Digital editing resources for creators. ${CONFIG.tagline}.</p></div>
<div><h4>Quick Links</h4><a href="#/">Home</a><a href="#/all">All Products</a><a href="#/c/free">Free Resources</a><a href="#/contact">Contact</a></div>
<div><h4>Categories</h4>${CATS.map(c=>`<a href="#/c/${c.id}">${c.name}</a>`).join("")}</div>
<div><h4>Follow</h4>${["Telegram","Instagram","YouTube"].map(k=>`<a target="_blank" rel="noopener" href="${CONFIG.links[k]}">${k}</a>`).join("")}</div>
<div><h4>Legal</h4><a href="#/privacy">Privacy Policy</a><a href="#/terms">Terms & Conditions</a><a href="#/refund">Refund Policy</a></div>`;
$("#yr").textContent=new Date().getFullYear();
$("#burger").onclick=()=>$("#nav").classList.toggle("open");
$("#sf").onsubmit=e=>{e.preventDefault();const q=$("#q").value.trim();if(q)location.hash="#/s/"+encodeURIComponent(q)};
addEventListener("hashchange",route);route();
</script></body></html>
